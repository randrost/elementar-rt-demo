<div class="min-h-screen flex flex-col items-center justify-center gap-6 p-8 bg-surface text-on-surface">

    <iconify-icon icon="solar:home-smile-bold-duotone" width="40" height="40" class="text-primary"></iconify-icon>
    <h1 class="text-2xl font-semibold">Elementar RT Admin</h1>
  </div>
  <p class="text-on-surface-variant max-w-md text-center">
    Toolchain check: Angular 20 + Material 3 + Tailwind v4 + elementar-rt theme + Iconify are wired.

  </div>
